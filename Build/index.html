<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- CSP Політика для роботи Unity WebGL -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">

    <title>TamagoChi AI</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #231F20;
        font-family: Arial, Helvetica, sans-serif;
      }
      #unity-container {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        background: #231F20;
        display: block;
      }
      #loading-cover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #231F20;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top: 5px solid #ff007f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #loading-text {
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading-cover">
        <div class="spinner"></div>
        <div id="loading-text">Завантаження 0%</div>
      </div>
    </div>

    <script src="Build/tamagotchi-webgl.loader.js"></script>
    <script>
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      var canvas = document.querySelector("#unity-canvas");
      var loadingCover = document.querySelector("#loading-cover");
      var loadingText = document.querySelector("#loading-text");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/tamagotchi-webgl.data",
        frameworkUrl: "Build/tamagotchi-webgl.framework.js",
        codeUrl: "Build/tamagotchi-webgl.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TamagoChi",
        productVersion: "0.1.0",
      }, (progress) => {
        loadingText.textContent = "Завантаження " + Math.round(progress * 100) + "%";
      }).then((unityInstance) => {
        loadingCover.style.opacity = "0";
        setTimeout(() => {
          loadingCover.style.display = "none";
        }, 500);
      }).catch((message) => {
        console.error(message);
        loadingText.textContent = "Помилка завантаження";
      });
    </script>
  </body>
</html>
